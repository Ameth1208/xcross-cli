<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#12121e"/>
      <stop offset="100%" stop-color="#08080c"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8dc0ff"/>
      <stop offset="50%" stop-color="#4d9fff"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle with Apple-like radius -->
  <rect x="1" y="1" width="62" height="62" rx="16" fill="url(#bg)" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
  <rect x="2" y="2" width="60" height="60" rx="15" stroke="url(#glow)" stroke-width="1" stroke-opacity="0.35"/>

  <!-- XCM Modern Monogram / Cross Symbol -->
  <path d="M16 18L32 34M32 34L48 18M32 34L16 46M32 34L48 46" stroke="url(#glow)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon)"/>
  
  <!-- Subtle center node -->
  <circle cx="32" cy="34" r="3" fill="#ffffff"/>
  
  <!-- Bottom brand indicator -->
  <circle cx="32" cy="54" r="1.5" fill="#4d9fff"/>
</svg>
